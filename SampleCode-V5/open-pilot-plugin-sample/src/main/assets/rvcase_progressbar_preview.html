<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Remote View - ProgressBar Case 预览 (新版结构)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: transparent; color: #FFFFFF; margin: 0; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
        .rv-card { background-color: rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .rv-card-title { font-size: 16px; font-weight: bold; margin: 0 0 -8px 0; color: #FFFFFF; }
        .rv-section-title { font-size: 14px; color: #CCCCCC; margin: 0 0 6px 0; }
        .rv-divider { height: 1px; background-color: rgba(255, 255, 255, 0.15); margin: 2px 0; }

        /* ====== 水平进度条 ====== */
        .rv-linear-progress-container { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .linear-pb-track { width: 100%; background-color: rgba(255, 255, 255, 0.2); border-radius: 6px; overflow: hidden; }
        .linear-pb-fill { height: 100%; border-radius: 6px; }
        
        /* 颜色类 */
        .fill-blue { background-color: #1A8BFF; }
        .fill-grey { background-color: #FFFFFF; } /* 对应源码的 GREY_1，通常是纯白或极浅灰 */
        .fill-red { background-color: #E41F29; }
        .fill-orange { background-color: #FF8100; }

        /* ====== 圆形进度条 ====== */
        .rv-circle-progress-container { display: flex; flex-direction: row; gap: 16px; align-items: center; }
        
        .circle-pb { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .circle-pb::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #383838; border-radius: 50%; }
        
        .inner-text { position: relative; z-index: 1; color: #FFFFFF; font-weight: 500; font-family: sans-serif;}

        /* 圆形尺寸类 */
        /* 20x20 */
        .c-20 { width: 28px; height: 28px; }
        .c-20::before { width: 22px; height: 22px; }
        .c-20 .inner-text { font-size: 9px; }
        /* 25x25 */
        .c-25 { width: 35px; height: 35px; }
        .c-25::before { width: 28px; height: 28px; }
        .c-25 .inner-text { font-size: 10px; }
        /* 30x30 */
        .c-30 { width: 42px; height: 42px; }
        .c-30::before { width: 34px; height: 34px; }
        .c-30 .inner-text { font-size: 11px; }

        /* 圆形渐变进度颜色类 - 修复无缝版 (100%采用纯色) */
        .grad-blue-33 { background: conic-gradient(#1A8BFF 0% 33%, rgba(255,255,255,0.2) 33% 100%); }
        .grad-blue-66 { background: conic-gradient(#1A8BFF 0% 66%, rgba(255,255,255,0.2) 66% 100%); }
        .grad-blue-100 { background-color: #1A8BFF; } /* 纯蓝无缝 */

        .grad-grey-66 { background: conic-gradient(#FF8100 0% 66%, rgba(255,255,255,0.2) 66% 100%); }
        .grad-red-88 { background: conic-gradient(#E41F29 0% 88%, rgba(255,255,255,0.2) 88% 100%); }
        
        /* 状态渐变色 */
        .grad-red-25 { background: conic-gradient(#E41F29 0% 25%, rgba(255,255,255,0.2) 25% 100%); }
        .grad-blue-45 { background: conic-gradient(#1A8BFF 0% 45%, rgba(255,255,255,0.2) 45% 100%); }
        .grad-green-100 { background-color: #00C774; } /* 纯绿无缝 */

        .status-icon { position: relative; z-index: 1; width: 14px; height: 14px; }
    </style>
</head>
<body>
    <div class="rv-card-title" data-i18n="card_type">01 组件类型</div>
    <div class="rv-card">
        <div class="rv-section-title" data-i18n="sec_linear_pb">水平进度条</div>
        <div class="rv-linear-progress-container">
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-blue" style="width: 33%;"></div></div>
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-blue" style="width: 66%;"></div></div>
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-blue" style="width: 100%;"></div></div>
        </div>
        
        <div class="rv-divider"></div>
        
        <div class="rv-section-title" data-i18n="sec_circle_pb">圆形进度条</div>
        <div class="rv-circle-progress-container">
            <div class="circle-pb c-30 grad-blue-33"><span class="inner-text">45%</span></div>
            <div class="circle-pb c-30 grad-blue-66"><span class="inner-text">45%</span></div>
            <div class="circle-pb c-30 grad-blue-100"><span class="inner-text">45%</span></div>
        </div>
    </div>

    <div class="rv-card-title" data-i18n="card_state">02 组件状态</div>
    <div class="rv-card">
        <div class="rv-section-title" data-i18n="sec_circle_pb_state">圆形进度条状态</div>
        <div class="rv-circle-progress-container">
            <div class="circle-pb c-30 grad-red-25">
                <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#E41F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <div class="circle-pb c-30 grad-blue-45"><span class="inner-text">45%</span></div>
            <div class="circle-pb c-30 grad-green-100">
                <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#00C774" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="rv-card-title" data-i18n="card_style">03 组件样式</div>
    <div class="rv-card">
        <div class="rv-section-title" data-i18n="sec_linear_pb_size">水平进度条大小</div>
        <div class="rv-linear-progress-container">
            <!-- 高度依次递增: 4, 8, 12 -->
            <div class="linear-pb-track" style="height: 4px;"><div class="linear-pb-fill fill-blue" style="width: 33%;"></div></div>
            <div class="linear-pb-track" style="height: 8px;"><div class="linear-pb-fill fill-blue" style="width: 66%;"></div></div>
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-blue" style="width: 100%;"></div></div>
        </div>

        <div class="rv-divider"></div>
        
        <div class="rv-section-title" data-i18n="sec_circle_pb_size">圆形进度条大小</div>
        <div class="rv-circle-progress-container">
            <!-- 尺寸依次递增: c-20, c-25, c-30 -->
            <div class="circle-pb c-20 grad-blue-33"><span class="inner-text">33%</span></div>
            <div class="circle-pb c-25 grad-blue-66"><span class="inner-text">66%</span></div>
            <div class="circle-pb c-30 grad-blue-100"><span class="inner-text">100%</span></div>
        </div>

        <div class="rv-divider"></div>
        
        <div class="rv-section-title" data-i18n="sec_linear_pb_color">水平进度条颜色</div>
        <div class="rv-linear-progress-container">
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-blue" style="width: 33%;"></div></div>
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-orange" style="width: 66%;"></div></div>
            <div class="linear-pb-track" style="height: 12px;"><div class="linear-pb-fill fill-red" style="width: 88%;"></div></div>
        </div>

        <div class="rv-divider"></div>
        
        <div class="rv-section-title" data-i18n="sec_circle_pb_color">圆形进度条颜色</div>
        <div class="rv-circle-progress-container">
            <div class="circle-pb c-30 grad-blue-33"><span class="inner-text">33%</span></div>
            <div class="circle-pb c-30 grad-grey-66"><span class="inner-text">66%</span></div>
            <div class="circle-pb c-30 grad-red-88"><span class="inner-text">88%</span></div>
        </div>
    </div>

    <script>
        // i18n 字典：key -> { zh, en }。默认 HTML 内文案为中文（无 JS 时兜底）。
        const I18N = {
            card_type:            { zh: "01 组件类型", en: "01 Component Type" },
            card_state:           { zh: "02 组件状态", en: "02 Component State" },
            card_style:           { zh: "03 组件样式", en: "03 Component Style" },
            sec_linear_pb:        { zh: "水平进度条",     en: "Horizontal Progress Bar" },
            sec_circle_pb:        { zh: "圆形进度条",     en: "Circular Progress Bar" },
            sec_circle_pb_state:  { zh: "圆形进度条状态", en: "Circular Progress Bar State" },
            sec_linear_pb_size:   { zh: "水平进度条大小", en: "Horizontal Progress Bar Size" },
            sec_circle_pb_size:   { zh: "圆形进度条大小", en: "Circular Progress Bar Size" },
            sec_linear_pb_color:  { zh: "水平进度条颜色", en: "Horizontal Progress Bar Color" },
            sec_circle_pb_color:  { zh: "圆形进度条颜色", en: "Circular Progress Bar Color" }
        };
        function setLang(lang) {
            const l = (lang === "zh") ? "zh" : "en";
            document.documentElement.lang = (l === "zh") ? "zh-CN" : "en";
            document.querySelectorAll("[data-i18n]").forEach(function (el) {
                const t = I18N[el.getAttribute("data-i18n")];
                if (t) el.innerHTML = t[l];
            });
            document.querySelectorAll("[data-i18n-value]").forEach(function (el) {
                const t = I18N[el.getAttribute("data-i18n-value")];
                if (t) el.value = t[l];
            });
            document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
                const t = I18N[el.getAttribute("data-i18n-title")];
                if (t) el.title = t[l];
            });
        }
    </script>
</body>
</html>
