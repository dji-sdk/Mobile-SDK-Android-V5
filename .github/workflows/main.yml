name: Build DJI APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Debug APK
        run: |
          cd SampleCode-V5/android-sdk-v5-as
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x lintVitalRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJI-Target-App
          path: SampleCode-V5/android-sdk-v5-as/app/build/outputs/apk/debug/*.apk
